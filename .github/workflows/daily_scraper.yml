name: 🌙 Daily Scraper Pipeline

on:
  schedule:
    # Collecte COMPLÈTE (Fraîcheur + Rattrapage) : le lundi à 05:00 UTC.
    - cron: '0 5 * * 1'
    # Collecte LÉGÈRE (Fraîcheur seule) : 3 fois par jour (07:00, 12:00, 18:00 UTC).
    # Petits passages fréquents = nouvelles offres vues tôt, sans se faire bloquer
    # par LinkedIn (dépôt public : minutes GitHub Actions gratuites).
    - cron: '0 7,12,18 * * *'
  workflow_dispatch: # Lancement manuel depuis l'interface GitHub
    inputs:
      mode:
        description: "complet ou leger"
        required: false
        default: "complet"

# Jamais deux collectes en même temps (elles écriraient la même base R2).
concurrency:
  group: scraper-pipeline
  cancel-in-progress: false

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      # Cache des fiches d'offres (descriptions stables) conservé entre les runs :
      # évite de relire les mêmes fiches LinkedIn (et les 429 qui vont avec).
      # Restauration et sauvegarde séparées : la sauvegarde a lieu même si le job
      # échoue (source dégradée), sinon le cache enrichi serait perdu chaque jour
      # de panne. Clé unique par run et par tentative ; restore-keys reprend le
      # plus récent.
      - name: Restauration du cache des fiches
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: scrape-detail-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scrape-detail-cache-

      # Collecte seulement : la notation par API est coupée (config.yaml, llm.scoring_api).
      # Les clés IA restent pour les lettres de motivation pré-générées (si activées).
      - name: Lancement du Pipeline (Scraping + Cloud Sync, sans notation)
        env:
          # Clés API IA (lettres de motivation uniquement)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          
          # CV du candidat (absent du dépôt public), lu par le juge LLM
          CANDIDATE_CV: ${{ secrets.CANDIDATE_CV }}

          # Accès Cloudflare R2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          
          # JobTeaser est désactivé (config.yaml) : si réactivé, ajouter
          # JOBTEASER_COOKIES. LinkedIn est lu sans compte.

        run: |
          if [ "${{ github.event.schedule }}" = "0 5 * * 1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" -a "${{ github.event.inputs.mode }}" != "leger" ]; then
            echo "Collecte complète"
            python run_pipeline.py
          else
            echo "Collecte légère"
            python run_pipeline.py --leger
          fi

      - name: Sauvegarde du cache des fiches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: scrape-detail-cache-${{ github.run_id }}-${{ github.run_attempt }}
