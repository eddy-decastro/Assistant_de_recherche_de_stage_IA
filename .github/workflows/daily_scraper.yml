name: 🌙 Daily Scraper Pipeline

on:
  schedule:
    # Tous les jours à 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      # Cache des fiches d'offres (descriptions stables) conservé entre les runs :
      # évite de relire les mêmes fiches LinkedIn (et les 429 qui vont avec).
      # Restauration et sauvegarde séparées : la sauvegarde a lieu même si le job
      # échoue (source dégradée), sinon le cache enrichi serait perdu chaque jour
      # de panne. Clé unique par run et par tentative ; restore-keys reprend le
      # plus récent.
      - name: Restauration du cache des fiches
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: scrape-detail-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scrape-detail-cache-

      - name: Lancement du Pipeline (Scraping + IA + Cloud Sync)
        env:
          # Clés API IA
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          
          # Accès Cloudflare R2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          
          # Cookies Scrapers
          JOBTEASER_COOKIES: ${{ secrets.JOBTEASER_COOKIES }}
          JOBTEASER_SESSION: ${{ secrets.JOBTEASER_SESSION }}
          JOBTEASER_CF_CLEARANCE: ${{ secrets.JOBTEASER_CF_CLEARANCE }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_JSESSIONID: ${{ secrets.LINKEDIN_JSESSIONID }}
          
        run: python run_pipeline.py

      - name: Sauvegarde du cache des fiches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: scrape-detail-cache-${{ github.run_id }}-${{ github.run_attempt }}
