scrapers:
  enabled_sources:
  - linkedin
  - jobteaser
  target_queries:
  - Stage Data Scientist
  - Stage Machine Learning
  - Stage Recherche IA
  max_offers_per_source: 200
  request_timeout_seconds: 30
  passes:
    freshness:
      enabled: true
      sort: date
      target_new_per_source: 150
      max_offers_per_query: 150
      window_days: 7
      early_stop_after_known: 10
      arm_early_stop: true
      early_stop_min_pages: 2
      max_pages_per_query: 20
      stop_when_older_than_window: true
      use_server_window_filter: true
      trust_source_order: false
    relevance:
      enabled: true
      sort: relevance
      target_new_per_source: 50
      max_offers_per_query: 50
      window_days: null
      early_stop_after_known: 0
      max_pages_per_query: 20
      stop_when_older_than_window: false
      use_server_window_filter: false
