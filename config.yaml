llm:
  # Notation des offres par API : coupée (11/11/2026). Les API (DeepSeek, puis
  # Gemini en secours) ne servent plus qu'aux lettres de motivation. Les offres
  # se notent à la main, par agents : python tools/antigravity_v4.py export --stale,
  # notation par Antigravity ou Claude Code, puis ingest. true = ancien comportement.
  scoring_api: false
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-chat
  # Lettres : Gemini d'abord (gratuit), DeepSeek en secours (payant, crédit à 0 $
  # le 11/11/2026). « deepseek » pour inverser l'ordre.
  cover_letter_provider: gemini
  cover_letter_model: gemini-3-flash-preview
  cover_letter_deepseek_model: deepseek-flash
  cover_letter_temperature: 0.4
  temperature: 0.0
  timeout_seconds: 60
  tier: free
  rate_limit_rpm: 60
  rate_limit_rpd: 5000
  concurrency: 4
  fallback_provider: google
  fallback_model: gemini-3.5-flash-lite
# Champs publics uniquement. Téléphone, email (et CV) : data/candidate.local.yaml
# (page Paramètres) ou secrets CANDIDATE_PHONE, CANDIDATE_EMAIL, CANDIDATE_CV.
# Voir src/candidate.py.
candidate:
  name: "Eddy DE CASTRO"
  title: "Élève-ingénieur IMT Mines Alès — double diplôme M2 Mathématiques en Action (Mines Saint-Étienne)"
  linkedin: "https://www.linkedin.com/in/eddy-de-castro/"
  github: "https://github.com/eddy-decastro"
  location: "Paris, France"

# ---------------------------------------------------------------------------
# Automatisations (toutes activables / désactivables individuellement)
# ---------------------------------------------------------------------------
automations:
  # Parallélisation de la collecte entre les différentes sources (LinkedIn, WTTJ, ATS, Académique)
  parallel_scraping: true
  # Pré-générer et sauvegarder en base la lettre de motivation des N meilleures nouvelles offres
  pregenerate_letters_enabled: false
  pregenerate_letters_top_n: 3
  pregenerate_letters_min_score: 85
  # Détection « offre fermée » (scrapers/liveness.py) : les offres « Nouveau » de
  # plus de N jours sont sondées (404/410, redirection vers la liste, texte « Les
  # candidatures ne sont plus acceptées », « Ce job n'est plus disponible »…).
  # Seules les offres prouvées fermées passent en IGNORÉ (raison « offre_fermee »,
  # note « [Auto] Fermée : <motif> ») ; erreur réseau, 429 ou anti-robot = rien conclu.
  check_expired_offers_enabled: true
  expired_offers_age_days: 7
  # Sondes réseau par run (les offres vérifiées ouvertes il y a moins de
  # expired_offers_recheck_days jours sont servies par le cache, gratuitement).
  expired_offers_max_checks: 40
  expired_offers_recheck_days: 3
  # Archivage par âge (12/11/2026) : une offre « à trier » ni publiée ni REVUE au
  # scraping depuis N jours passe en IGNORÉ (auto_archive). L'âge compte depuis le
  # dernier passage du scraping (seen_jobs.last_seen_at) : une offre encore en ligne
  # n'est pas archivée, et une offre archivée que le scraping revoit revient à trier
  # avec sa note (reopen_rediscovered). Retrouvables dans l'appli (offres ignorées).
  auto_archive_enabled: true
  auto_archive_age_days: 30
  # Envoyer un résumé de fin de pipeline par Webhook (Discord / Slack / Telegram)
  notifications_enabled: false
  notification_min_score: 75
  # Activer les rappels de relance (badge J+14) dans le Kanban
  followup_reminders_enabled: true
  followup_days_threshold: 14
  # Calibration légère du juge LLM à partir des offres Postulées / Archivées
  enable_preference_learning: false
  # Sauvegarde quotidienne horodatée de la base SQLite sur Cloudflare R2 (backups/)
  cloud_backup_enabled: true
  cloud_backup_retention_days: 7


