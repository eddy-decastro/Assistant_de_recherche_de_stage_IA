scrapers:
  # JobTeaser désactivé (30/09/2026) : accès au compte école perdu et scraping
  # contraire aux conditions d'utilisation. Réactiver en ajoutant « - jobteaser ».
  # Une source ou un board en panne ne bloque rien : la cause (http_404, timeout,
  # parse_error, vide…) est consignée dans la télémétrie et signalée en fin de run.
  enabled_sources:
  - linkedin
  - wttj
  - ats
  - academic
  - workday
  # Pas de « Stage » dans les requêtes : WTTJ (contract_type:internship) et
  # JobTeaser (contract=internship) filtrent le contrat côté serveur. LinkedIn
  # invité ignore f_JT=I (mesuré le 04/11/2026 : 0/20 stage sur « Data Scientist ») :
  # le scraper ajoute lui-même « (stage OR stagiaire OR internship OR intern) »
  # aux requêtes qui ne parlent pas déjà de stage (linkedin_internship_keywords).
  # Ordre = priorité : l'objectif de nouvelles offres par source peut être atteint
  # avant les dernières requêtes.
  target_queries:
  - Data Scientist
  - Machine Learning
  - Data Science
  - Deep Learning
  - Recherche IA
  - AI Research
  - Computer Vision
  - NLP
  - LLM
  - Intelligence Artificielle
  - stage recherche IA
  - stage deep learning
  - stage LLM
  - stage NLP
  - stage machine learning recherche
  - research intern machine learning
  - internship deep learning
  - stage R&D IA
  - stage M2 apprentissage statistique
  - stage modèles génératifs
  max_offers_per_source: 200
  request_timeout_seconds: 30
  # LinkedIn n'expose pas la description dans ses cartes : la fiche détail est lue
  # pendant la collecte pour filtrer (et scorer) sur le texte complet.
  enrich_descriptions: true
  max_detail_fetches_per_source: 200
  # Boards ATS publics, un slug par entreprise. Tous vérifiés par sonde le
  # 04/11/2026 (python tools/probe_sources.py --source ats). Un slug mort n'arrête
  # rien mais apparaît en « http_404 » ou « vide » dans le résumé du run.
  # Retirés (morts) : lever mistral/owkin/qonto/shift-technology/backmarket,
  # greenhouse huggingface/alan/criteo, ashby bioptimus, smartrecruiters sanofi.
  # Ajoutés le 11/11/2026 après sonde des API publiques (stages en France trouvés) :
  # artefact (17), vestiairecollective (8), voodoo (5), doctrine (4), malt, heetch,
  # younited, veepee, pennylane, sorare. Sources par API : aucun risque de blocage,
  # on peut les lire en entier à chaque passage.
  ats_boards:
    lever:
      - contentsquare
      - pigment
      - alice-bob
      - swile
      - ekimetrics
      - vestiairecollective
      - doctrine
      - malt
      - heetch
      - younited
      - veepee
    greenhouse:
      - datadog
      - dataiku
      - bioptimus8
      - algolia
      - mirakl
      - shifttechnology
      - helsing
      - artefact
    ashby:
      - mistral.ai
      - dust
      - owkin
      - alan
      - qonto
      - photoroom
      - nabla
      - hcompany
      - doctolib
      - backmarket
      - ledger
      - sonio
      - lifen
      - voodoo
      - pennylane
      - sorare
    smartrecruiters:
      - Ubisoft2
    workable:
      - huggingface
  # Flux publics des labos : Inria (page de liste + fiches) et CEA (RSS
  # emploi.cea.fr). CNRS retiré : le RSS redirige vers une 404 et le portail ne
  # publie pas de stages.
  academic_feeds:
    - inria
    - cea
  # Grands groupes sur Workday (API JSON publique, filtre stage + France par
  # facettes). Vérifiés par sonde le 04/11/2026. Pas sur Workday : Safran,
  # Schneider Electric (iCIMS), Stellantis, EDF, TotalEnergies.
  workday_boards:
    - name: Thales
      url: https://thales.wd3.myworkdayjobs.com/Careers
    - name: Airbus
      url: https://ag.wd3.myworkdayjobs.com/Airbus
    - name: Sanofi
      url: https://sanofi.wd3.myworkdayjobs.com/SanofiCareers
    - name: Renault Group
      url: https://alliancewd.wd3.myworkdayjobs.com/renault-group-careers
    - name: Valeo
      url: https://valeo.wd3.myworkdayjobs.com/valeo_jobs
    - name: Michelin
      url: https://michelinhr.wd3.myworkdayjobs.com/Michelin
    - name: Air Liquide
      url: https://airliquidehr.wd3.myworkdayjobs.com/AirLiquideExternalCareer
    - name: Criteo
      url: https://criteo.wd3.myworkdayjobs.com/Criteo_Career_Site
    - name: Ipsen
      url: https://ipsen.wd103.myworkdayjobs.com/Ipsen_Careers
    - name: Philips
      url: https://philips.wd3.myworkdayjobs.com/jobs-and-careers
    - name: NXP
      url: https://nxp.wd3.myworkdayjobs.com/careers
  # WTTJ : pays des bureaux (filtre Algolia offices.country_code). « FR » écarte
  # les ~30 % de stages hors France de l'index ; liste possible ([FR, BE]) ;
  # vide (« "" ») = tous pays. La variable d'environnement WTTJ_COUNTRY prime.
  wttj_country: FR
  # LinkedIn : ajoute « (stage OR stagiaire OR internship OR intern) » aux
  # requêtes qui ne mentionnent pas déjà le stage (f_JT=I ignoré en invité).
  linkedin_internship_keywords: true
  passes:
    freshness:
      enabled: true
      sort: date
      target_new_per_source: 150
      # Plafond par requête (S7, 10/11/2026) : à 150, « Data Scientist » et
      # « Machine Learning » remplissaient l'objectif de la source et les requêtes
      # de niche (stage LLM, research intern, R&D IA) ne tournaient jamais.
      # 20 x 20 requêtes = 400 > 150 : l'objectif se répartit sur ~8 requêtes au moins.
      max_offers_per_query: 20
      window_days: 14
      early_stop_after_known: 10
      arm_early_stop: true
      early_stop_min_pages: 2
      # 10 pages LinkedIn = 100 cartes par requête ; au-delà, surtout des 429.
      max_pages_per_query: 10
      stop_when_older_than_window: true
      use_server_window_filter: true
      trust_source_order: false
    relevance:
      enabled: true
      sort: relevance
      target_new_per_source: 50
      max_offers_per_query: 8
      window_days: null
      # Arrêt anticipé armé : 3 pages LinkedIn pleines d'offres déjà connues
      # (mesuré : ~80 % de connues en Pertinence) = plus rien à gagner, et
      # chaque page de trop rapproche du 429.
      early_stop_after_known: 30
      arm_early_stop: true
      early_stop_min_pages: 3
      max_pages_per_query: 20
      stop_when_older_than_window: false
      use_server_window_filter: false
  telemetry:
    enabled: true
    retention_days: 180
    prune_seen_jobs: true
