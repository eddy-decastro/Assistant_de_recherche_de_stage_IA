# ============================================================
# stage_copilot — Configuration centrale
# Tous les filtres "durs", listes d'entreprises et coefficients
# de scoring sont définis ici.
# ============================================================

# ⚠️ HISTORIQUE : section non lue par le code (décrit l'ancienne API WTTJ v1,
# retirée par l'éditeur fin 2024). La collecte est pilotée par `scrapers:` ci-dessous.
scraping:
  source: "welcome_to_the_jungle"
  base_url: "https://www.welcometothejungle.com"
  api_base: "https://api.welcometothejungle.com/api/v1"

  # Mots-clés de recherche
  search_keywords:
    - "Data Science"
    - "Machine Learning"
    - "Data Engineer"

  # Filtres "durs" : type de contrat et localisation
  contract_filter: "internship"
  location_filters:
    - "Paris"
    - "Île-de-France"

  max_offers: 150
  request_timeout_seconds: 30

# ============================================================
# Collecte : paramètres RÉELLEMENT lus par les scrapers
# (ScraperConfig / scrapers/models.py — plus de valeurs codées en dur)
# ============================================================
scrapers:
  # Sources activées. wttj : retiré car injoignable dans cet environnement
  # (DNS `v3splegsrc-dsn.algolia.net`) — le scraper reste implémenté et aligné sur
  # la collecte hybride, il suffit de le remettre ici pour le réactiver.
  # jobteaser : inactif tant que .env ne contient pas JOBTEASER_COOKIES.
  enabled_sources:
    - "linkedin"
    - "jobteaser"

  # Requêtes cibles envoyées aux plateformes. Les moteurs indexent la requête
  # telle quelle : conserver le préfixe « Stage » pour ne remonter que des stages.
  target_queries:
    - "Stage Data Scientist"
    - "Stage Machine Learning"
    - "Stage Recherche IA"

  # Plafond GLOBAL (union des deux passes) pour une source. Il est appliqué
  # pendant les passes : dès qu'il est atteint, les requêtes suivantes ne sont
  # plus lancées. Borne la charge réseau et le risque de 429.
  #
  # Valeur alignée sur les objectifs réels : 40 nouvelles en Fraîcheur, puis
  # 10 plus pertinentes en Rattrapage ⇒ 50 au total, sous ce plafond de 60. La
  # part du Rattrapage est RÉSERVÉE : la passe Fraîcheur ne peut pas la consommer
  # (sinon « les 10 plus pertinentes » seraient affamées par une Fraîcheur
  # généreuse, sans trace dans la télémétrie).
  max_offers_per_source: 60
  # DÉPRÉCIÉ (conservé pour les configurations antérieures) : quota « à plat »,
  # utilisé uniquement si la section `passes` ci-dessous est absente.
  # max_offers_per_query: 40

  request_timeout_seconds: 30

  # ------------------------------------------------------------
  # Stratégie de collecte hybride : deux passes complémentaires par requête
  # ------------------------------------------------------------
  # À CHAQUE BOUCLE, pour chaque source :
  #   1. « Fraîcheur »  : les 40 dernières offres — tri par date, filtre temporel
  #                       serveur (LinkedIn : f_TPR) et ARRÊT ANTICIPÉ dès que
  #                       10 offres déjà vues s'enchaînent (le flux a rejoint ce
  #                       qui est déjà en base : on arrête de chercher) ;
  #   2. « Rattrapage » : les 10 plus pertinentes — classement algorithmique de la
  #                       plateforme, SANS fenêtre temporelle et SANS arrêt
  #                       anticipé, pour ne pas manquer les offres toujours
  #                       actives publiées il y a plus d'un mois.
  # Chaque objectif (target_new_per_source) est fixé à la SOURCE, toutes requêtes
  # confondues : atteint, il interrompt la passe et les requêtes restantes sont
  # consignées en télémétrie (jamais d'arrêt silencieux).
  # La déclaration est EXPLICITE : un mode absent de cette section n'est pas
  # exécuté. Une offre collectée en « Fraîcheur » n'est jamais recomptée en
  # « Rattrapage » (déduplication transverse).
  passes:
    freshness:
      enabled: true
      sort: "date"
      # Objectif de NOUVELLES offres pour la source : « les 40 dernières ».
      target_new_per_source: 40
      # Soupape par requête, en deçà de l'objectif de source.
      max_offers_per_query: 40
      # Fenêtre temporelle : 1 = 24 h, 7 = une semaine, null = aucune limite.
      window_days: 7
      # Arrêt anticipé : 10 offres DÉJÀ VUES consécutives ⇒ on a déjà tout vu.
      # Le compteur est remis à zéro par toute carte inédite et il traverse les
      # pages ; il additionne « déjà en base » et « déjà croisée dans ce run ».
      #
      # ⚠️ ARRÊT ARMÉ MALGRÉ UN ORDRE NON CHRONOLOGIQUE. LinkedIn n'honore pas son
      # tri par date (7 inversions mesurées sur 2 pages, cf. tools/probe_sources.py).
      # Cette règle se prononce néanmoins sur une SÉRIE de 10 cartes, insensible aux
      # inversions locales : elle est donc fiable là où l'arrêt sur fenêtre (UNE
      # carte) ne l'est pas — ce dernier reste, lui, désarmé ci-dessous.
      early_stop_after_known: 10
      arm_early_stop: true
      # Pages minimales avant d'autoriser l'arrêt anticipé. Une page fait 10 cartes :
      # sans cette garde, « 10 déjà vues » serait équivalent à la détection de
      # pagination stagnante ; avec elle, l'arrêt tombe dès la 2e page et évite les
      # 10 pages suivantes d'un flux déjà parcouru.
      early_stop_min_pages: 2
      # Plafond de pages par requête : borne la charge réseau. Mesuré en réel : à
      # 6 pages, la requête « Stage Data Scientist » s'arrête sur `max_pages`
      # (17 offres retenues) ⇒ plafond relevé à 12 pages (120 cartes), la fenêtre
      # de 7 jours restant naturellement bornée.
      max_pages_per_query: 12
      # Arrêter la passe sur la première offre antérieure à la fenêtre (utile
      # uniquement si l'ordre du flux est chronologique — désarmé sur LinkedIn).
      stop_when_older_than_window: true
      # Demander le filtrage temporel à la plateforme quand elle le permet
      # (LinkedIn : f_TPR=r<secondes>).
      use_server_window_filter: true
      # Réglage expert : forcer la confiance dans l'ordre renvoyé par la source
      # (pilote l'arrêt sur fenêtre, PAS l'arrêt sur série de connues).
      trust_source_order: false

    relevance:
      enabled: true
      sort: "relevance"
      # Objectif de NOUVELLES offres pour la source : « les 10 plus pertinentes ».
      target_new_per_source: 10
      max_offers_per_query: 20
      window_days: null
      # Jamais d'arrêt anticipé : ce classement n'est pas temporel, et c'est lui le
      # filet de sécurité de ce que l'arrêt anticipé de la Fraîcheur aurait sauté.
      early_stop_after_known: 0
      max_pages_per_query: 12
      stop_when_older_than_window: false
      use_server_window_filter: false

  # ------------------------------------------------------------
  # Observabilité : télémétrie des passes + mémoire de collecte
  # ------------------------------------------------------------
  telemetry:
    enabled: true
    # Rétention des runs et des passes tracés (jours).
    retention_days: 180
    # Élaguer aussi la mémoire de collecte (offres vues mais jamais retenues).
    prune_seen_jobs: true

  # Les listes de mots-clés (exclusion BI / signaux DS-ML) restent aux valeurs du
  # code ; décommenter pour les surcharger depuis le YAML :
  # exclusion_keywords: ["power bi", "tableau", "qlik", "vba", "data analyst"]
  # positive_ds_ml_keywords: ["data scientist", "machine learning", "pytorch", "llm"]

scoring:
  # Modèle d'embedding. Mesures sur la base réelle (68 fiches, verdicts du juge LLM
  # comme vérité terrain) : all-MiniLM-L6-v2 corrèle faiblement mais POSITIVEMENT au
  # classement du juge (rho +0,09 à n=30), tandis que
  # paraphrase-multilingual-MiniLM-L12-v2 (FR/EN) est franchement CONTRE-productif
  # (rho -0,59) : le vocabulaire discriminant du corpus est technique et anglophone
  # (PyTorch, GNN, RAG, MLOps). Décision : conserver le modèle anglais.
  model_name: "all-MiniLM-L6-v2"
  # Fenêtre de contexte en tokens (None = fenêtre native du modèle). À n=30, l'écart
  # 128 / 256 tokens (rho +0,01 contre +0,09) est DANS LE BRUIT (erreur type ~0,19) :
  # la fenêtre native est conservée, le levier est pilotable mais sans gain démontré.
  max_seq_length: 256
  cv_path: "data/cv_eddy.txt"

  # Pondération du score final (la somme doit faire 1.0)
  weights:
    semantic: 0.60    # similarité sémantique CV vs offre
    company: 0.25     # typologie d'entreprise
    keywords: 0.15    # mots-clés d'excellence

  # Mots-clés "d'excellence" valorisés dans les offres
  excellence_keywords:
    - "PyTorch"
    - "TensorFlow"
    - "GNN"
    - "Graph Neural Network"
    - "Docker"
    - "Kubernetes"
    - "Airflow"
    - "MLflow"
    - "Spark"
    - "dbt"
    - "Hugging Face"
    - "LLM"
    - "RAG"
    - "NLP"
    - "Computer Vision"
    - "scikit-learn"
    - "SQL"
    - "PostgreSQL"
    - "MLOps"

